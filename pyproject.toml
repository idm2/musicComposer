[project]
name = "songcomposer"
version = "0.1.0"
description = "Songwriter and proof-of-concept generator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "yt-dlp>=2026.8.19",
    "music21==10.5.0",
]

[project.optional-dependencies]
analysis = [
    "numpy==1.26.4",                 # basic-pitch's tensorflow pin forces numpy<2; demucs does not declare numpy at all
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "demucs==4.1.0",
    "librosa==0.11.0",
    "soundfile==0.14.0",
    "pyloudnorm>=0.1.1",
    "pretty-midi==0.2.11.post0",
    "basic-pitch[onnx]==0.4.0",
    "faster-whisper==1.2.1",
    "lv-chordia==1.1.0",
    "beat-this @ https://github.com/CPJKU/beat_this/archive/b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c.zip",
]

[project.scripts]
songcomposer = "songcomposer.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songcomposer"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["gpu: needs the local GPU analysis stack and model downloads (deselect with -m 'not gpu')"]
