[project]
name = "songcomposer"
version = "0.1.0"
description = "Songwriter and proof-of-concept generator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
songcomposer = "songcomposer.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songcomposer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["gpu: needs the local GPU analysis stack and model downloads (deselect with -m 'not gpu')"]
